name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main, "claude/**"]
  workflow_dispatch:

# Grant the workflow token the permissions needed by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one live deploy at a time; queue the next one if needed.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build web bundle with pygbag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        # pygbag uses ffmpeg to transcode bundled MP3/WAV assets into OGG.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install pygbag
        run: |
          python -m pip install --upgrade pip
          pip install "pygbag>=0.9"

      - name: Build the WebAssembly bundle
        # Keep the default pygame-web CDN so pygbag can fetch `default.tmpl`
        # during the build. The Firefox OpaqueResponseBlocking fix is applied
        # post-build by self-hosting the runtime alongside the game (next step).
        run: |
          python -m pygbag \
            --build \
            --archive \
            --ume_block 0 \
            --disable-sound-format-error \
            main.py

      - name: Self-host the pygbag runtime
        # Firefox's OpaqueResponseBlocking (and strict CSP setups) reject the
        # cross-origin scripts pygame-web.github.io serves, leaving the canvas
        # blank. Mirror the runtime next to the game so everything loads from
        # the same origin.
        #
        # The pygame-web CDN reorganised: ``pythons.js`` + ``cpython312/*`` +
        # ``empty.html`` still live at ``/cdn/0.9.3/`` (version-pinned),
        # while ``vtx.js`` / ``vt.js`` (the dynamic ES-module imports
        # pythons.js does via ``await import("../vt[x].js")``) moved to
        # ``/cdn/`` (unversioned). Mirror each from the correct path.
        #
        # The other files the previous version tried to mirror (snd.js /
        # gui.js / fs.js / browserfs / xterm.*) aren't separate modules —
        # those features live as functions *inside* pythons.js and the
        # ``data-os="vtx,snd,gui"`` attribute just toggles their code
        # paths. 404s on those filenames have always been harmless; we
        # drop them to make the manifest match reality.
        #
        # Patch pythons.js so ``../vt[x].js`` resolves inside the deploy
        # subdirectory. pythons.js sits at ``/<repo>/pythons.js``; its
        # literal ``../`` would resolve to origin root, which we can't
        # write to on a project Pages site. Rewriting to ``./`` lands
        # the imports next to pythons.js where we DO control the path.
        run: |
          set -euo pipefail
          cd build/web
          REPO_NAME="${GITHUB_REPOSITORY##*/}"

          fetch_required() {
            local url="$1" dest="$2"
            mkdir -p "$(dirname "$dest")"
            if ! curl -fsSL "$url" -o "$dest"; then
              echo "FATAL: required runtime file missing from CDN: $url" >&2
              exit 1
            fi
            echo "  ok   $dest  ($url)"
          }

          CDN_VERSIONED="https://pygame-web.github.io/cdn/0.9.3"
          CDN_LATEST="https://pygame-web.github.io/cdn"

          # Files that pythons.js loads via ``config.cdn`` (versioned path).
          # ``cpythonrc.py`` is the bootstrap script CPython runs at
          # startup — it defines ``import_site``, ``import_pkg`` and the
          # PEP 723 dependency-installer that ``site.py`` calls into.
          # Without it the very first frame after the WASM interpreter
          # loads dies with ``NameError: name 'import_site' is not
          # defined``.
          for f in \
            pythons.js \
            cpythonrc.py \
            empty.html \
            cpython312/main.js \
            cpython312/main.data \
            cpython312/main.wasm; do
            fetch_required "$CDN_VERSIONED/$f" "$f"
          done

          # Files pythons.js dynamic-imports via ``../vt[x].js`` —
          # unversioned on the CDN, must land at the SAME directory as
          # pythons.js after the import-path patch below.
          for f in vtx.js vt.js; do
            fetch_required "$CDN_LATEST/$f" "$f"
          done

          # Patch pythons.js: ``await import("../vt.js")`` →
          # ``await import("./vt.js")`` (same for vtx.js). Without this,
          # the browser resolves ``../`` against pythons.js's URL
          # (``/<repo>/pythons.js``), yielding origin-root paths that
          # 404 on project Pages sites.
          sed -i 's|await import("\.\./vt\.js")|await import("./vt.js")|g'   pythons.js
          sed -i 's|await import("\.\./vtx\.js")|await import("./vtx.js")|g' pythons.js
          if grep -q '"\.\./vt' pythons.js; then
            echo "FATAL: pythons.js still contains ../ imports after patch" >&2
            grep -n '"\.\./vt' pythons.js >&2
            exit 1
          fi

          # Prepend ``<!DOCTYPE html>``. pygbag's template ships an
          # index that opens with ``<html lang="en-us">`` directly —
          # browsers fall back to Quirks Mode without a doctype, which
          # changes box-model + flex-layout calculations. The console
          # warning ("This page is in Quirks Mode…") is harmless on its
          # own but breaks layout reproducibility between browsers.
          if ! head -c 50 index.html | grep -qi "<!doctype"; then
            sed -i '1i<!DOCTYPE html>' index.html
          fi

          # Drop the dead ``<script src=".../browserfs.min.js">`` tag.
          # pygbag's template references browserfs for in-browser
          # filesystem persistence, but pygame-web removed the upstream
          # dependency a few versions back (pythons.js line 1251:
          # "was browserfs, removed must be fully provided from
          # template"). The script tag now just 404s on every load
          # and clutters the console. Strip it so the load is clean.
          sed -i '/browserfs\.min\.js/d' index.html

          # Drop the ``vtx`` feature from ``data-os``. ``vtx`` toggles
          # the in-browser xterm terminal for Python stdout — useful for
          # CLI tools, useless for a graphical game (the player never
          # sees a terminal). Keeping it on would pull in
          # ``vt/xterm.js`` + ``vt/xterm.css`` + ``vt/xterm-addon-image.{js,wasm}``,
          # all of which would 404 on Pages (vtx.js builds the path
          # as ``config.cdn + "../vt/"`` which resolves to origin
          # root). Dropping vtx removes the whole xterm dependency
          # chain. ``snd,gui`` is enough for a pygame game.
          sed -i 's|data-os="vtx,snd,gui"|data-os="snd,gui"|g' index.html
          sed -i 's|data-os="vtx,fs,gui,snd"|data-os="fs,gui,snd"|g' index.html
          if grep -q 'data-os="[^"]*vtx' index.html; then
            echo "FATAL: index.html still requests vtx feature after patch" >&2
            grep -n 'data-os' index.html >&2
            exit 1
          fi

          # config.cdn points pythons.js at the repo-scoped subdirectory
          # for non-relative loads (cpython312/*, lib/index.html, …).
          sed -i "s|https://pygame-web.github.io/cdn/0.9.3/|/$REPO_NAME/|g" index.html

          echo "--- build/web layout ---"
          ls -la
          echo "--- cpython312 ---"
          ls -la cpython312 2>/dev/null || true

      - name: Publish privacy policy alongside the web build
        # The Play Store listing needs a public URL for the privacy policy.
        # Hosting it next to the web build keeps a single Pages deploy.
        # Final URL: https://<user>.github.io/<repo>/privacy.html
        run: |
          cp docs/privacy.html build/web/privacy.html
          test -f build/web/privacy.html

      - name: Prepare artifact
        run: |
          ls -la build/web
          # GitHub Pages serves index.html at the deployed URL root.
          test -f build/web/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
